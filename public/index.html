<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel Server</title>
<style>
:root{--bg:#0b0f14;--s1:#121922;--s3:#1f2a37;--line:#263344;--tx:#e6edf3;--mut:#8b98a8;--acc:#3b82f6;--ok:#22c55e;--warn:#eab308;--bad:#ef4444;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc);text-decoration:none;cursor:pointer}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--s3);padding:2px 7px;border-radius:6px;word-break:break-all}
.top{position:sticky;top:0;z-index:9;background:rgba(18,25,34,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;gap:6px;padding:0 14px}
.brand{font-weight:700;font-size:16px;margin-right:14px}
.top a.nl{color:var(--mut);padding:7px 11px;border-radius:8px}
.top a.nl:hover,.top a.nl.on{color:var(--tx);background:var(--s3)}
.sp{flex:1}.who{color:var(--mut);font-size:13px;margin-right:6px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:22px;margin:0;font-weight:650}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:600}
.muted{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.srv{display:block;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--tx);transition:border-color .15s,transform .15s}
.srv:hover{border-color:var(--acc);transform:translateY(-1px)}
.srv .n{font-weight:600;font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--s3);color:var(--mut);white-space:nowrap}
.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.running{color:var(--ok)}.badge.starting,.badge.stopping{color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 15px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:default}
.btn.ok{background:var(--ok);color:#06240f}.btn.warn{background:var(--warn);color:#2a2100}.btn.bad{background:var(--bad)}
.btn.ghost{background:var(--s3);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:13px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 11px;font:inherit;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
label.chk{display:flex;align-items:center;gap:6px;color:var(--mut);white-space:nowrap}
label.chk input{width:auto}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form>*{flex:1 1 150px;width:auto}.form>.btn{flex:0 0 auto}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:500;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:10px 14px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs a.on{color:var(--tx);border-color:var(--acc)}
.power{display:flex;gap:8px;flex-wrap:wrap}
.term{background:#06090d;border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;height:min(60vh,520px);overflow:auto;padding:12px 14px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:#cfd8e3}
.cmd{display:flex;align-items:center;background:#06090d;border:1px solid var(--line);border-top:0;padding:0 12px}
.cmd span{color:var(--acc);font-family:ui-monospace,monospace;margin-right:8px}
.cmd input{border:0;background:transparent;padding:11px 0;font-family:ui-monospace,monospace;box-shadow:none!important}
.info{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s1);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r)}
.info>div{padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.info>div:last-child{border-right:0}
.lb{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.v{font-weight:600;font-size:15px}
.bar{height:6px;background:var(--s3);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px;transition:width .4s ease}
.addr code{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.crumbs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-family:ui-monospace,monospace;font-size:13px}
.crumbs a{color:var(--tx)}.crumbs .sep{color:var(--mut)}
.files td.nm{cursor:pointer;font-weight:500}
.files td.nm:hover{color:var(--acc)}
.files .act{text-align:right;white-space:nowrap}
.files .act a,.files .act button{margin-left:10px;font-size:13px;color:var(--mut);background:none;border:0;padding:0;font:inherit;cursor:pointer}
.files .act button:hover{color:var(--bad)}
.up{display:flex;flex-direction:column;gap:6px}
.up .row{display:flex;justify-content:space-between;gap:10px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login .card{padding:26px}
.login h1{text-align:center;margin-bottom:6px}
.login p.sub{text-align:center;color:var(--mut);margin:0 0 20px}
.login .btn{width:100%;padding:11px}
textarea.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:55vh;resize:vertical;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{color:var(--mut);font-size:13px}
.hint{color:var(--mut);font-size:13px;margin-top:8px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;align-items:center;margin-bottom:12px}
@media(max-width:700px){.info{grid-template-columns:1fr}.info>div{border-right:0;border-bottom:1px solid var(--line)}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=b=>b>1048576?(b/1048576).toFixed(1)+' MB':b>1024?(b/1024).toFixed(1)+' KB':b+' B';
const LBL={running:'Berjalan',offline:'Mati',starting:'Memulai',stopping:'Menghentikan'};
const LTYPE={node:'Node.js',python:'Python',web:'Web statis'};
const badge=s=>`<span class="badge ${esc(s)}">${LBL[s]||esc(s)}</span>`;
const tlabel=s=>LTYPE[s.type||'node']||'Node.js';

async function api(u,opt={}){
  const h={};let body=opt.body,method=opt.method||'GET';
  if(opt.json!==undefined){h['Content-Type']='application/json';body=JSON.stringify(opt.json);method=opt.method||'POST'}
  if(opt.text!==undefined){h['Content-Type']='text/plain';body=opt.text;method=opt.method||'PUT'}
  const r=await fetch('/api'+u,{method,headers:h,body,credentials:'same-origin'});
  const ct=r.headers.get('content-type')||'';
  const data=ct.includes('application/json')?await r.json():await r.text();
  if(!r.ok)throw new Error(data&&data.error?data.error:'Gagal ('+r.status+')');
  return data}
const post=(u,j)=>api(u,{json:j||{}});

let me=null,S=null,tab='console',cwd='/',ws=null,pollT=null;
const app=()=>$('#app');
const join=n=>(cwd==='/'?'':cwd)+'/'+n;
const parent=()=>cwd.split('/').slice(0,-1).join('/')||'/';
function closeWs(){if(ws){try{ws.close()}catch{}ws=null}if(pollT){clearInterval(pollT);pollT=null}}
function mount(content,active){closeWs();
  app().innerHTML=`<header class="top"><span class="brand">Panel</span>
   <a class="nl ${active==='servers'?'on':''}" href="#/">Server</a>${me.admin?`<a class="nl ${active==='admin'?'on':''}" href="#/admin">Admin</a>`:''}
   <span class="sp"></span><span class="who">${esc(me.username)}</span><button class="btn ghost sm" id="logout">Keluar</button></header>
   <main class="wrap">${content}</main>`;
  $('#logout').onclick=async()=>{await api('/logout',{method:'POST',json:{}}).catch(()=>{});me=null;location.hash='';boot()}}

function loginView(err){closeWs();
  app().innerHTML=`<div class="login"><div class="card"><h1>Panel Server</h1><p class="sub">Masuk untuk mengelola server</p>
   <div class="field"><label>Username</label><input id="u" autocomplete="username" autocapitalize="off"></div>
   <div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password"></div>
   <button class="btn" id="go">Masuk</button><div class="err" id="le">${esc(err||'')}</div></div></div>`;
  const go=async()=>{$('#go').disabled=true;try{await api('/login',{json:{username:$('#u').value.trim(),password:$('#p').value}});boot()}catch(e){$('#le').textContent=e.message;$('#go').disabled=false}};
  $('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()};$('#u').focus()}

async function boot(){try{me=await api('/me')}catch{me=null;return loginView()}route()}
window.onhashchange=()=>{if(me)route()};
function route(){const h=location.hash||'#/';
  if(h.startsWith('#/server/'))return serverView(decodeURIComponent(h.slice(9)));
  if(h==='#/admin'&&me.admin)return adminView();
  return listView()}

async function listView(){const list=await api('/servers');
  mount(`<div class="head"><h1>Server</h1><span class="muted">${list.length} server</span></div>
  <div class="grid">${list.map(x=>`<a class="srv" href="#/server/${esc(x.id)}"><div class="n"><span>${esc(x.name)}</span>${badge(x.status)}</div>
  <div class="muted">${esc(tlabel(x))} · RAM ${x.ram} MB${me.admin?' · Owner '+esc(x.ownerName):''}</div>
  <div class="hint"><code>${esc(x.id)}</code></div></a>`).join('')||'<div class="card empty" style="grid-column:1/-1">Belum ada server</div>'}</div>`,'servers')}

async function adminView(){const [srvs,users]=await Promise.all([api('/servers'),api('/users')]);
  const types=await api('/types');
  mount(`<div class="head"><h1>Admin</h1></div>
  <div class="card"><h2>Buat server baru</h2><div class="form">
    <input id="sn" placeholder="Nama server">
    <select id="so">${users.map(u=>`<option value="${u.id}">${esc(u.username)}</option>`).join('')}</select>
    <select id="st">${types.map(t=>`<option value="${t.id}">${esc(t.label)}</option>`).join('')}</select>
    <input id="sr" type="number" min="128" value="1024" placeholder="RAM (MB)">
    <button class="btn" id="sc">Buat</button></div><div class="err" id="se"></div></div>
  <div class="card"><h2>Semua server (${srvs.length})</h2><div style="overflow:auto"><table><thead><tr><th>Nama</th><th>Tipe</th><th>Owner</th><th>Status</th><th>RAM</th><th>Kode</th><th></th></tr></thead><tbody>
  ${srvs.map(x=>`<tr><td><a href="#/server/${esc(x.id)}">${esc(x.name)}</a></td><td>${esc(tlabel(x))}</td><td>${esc(x.ownerName)}</td><td>${badge(x.status)}</td><td>${x.ram} MB</td><td><code>${esc(x.id)}</code></td><td style="text-align:right"><button class="btn bad sm" data-del-srv="${esc(x.id)}">Hapus</button></td></tr>`).join('')||'<tr><td colspan=7 class="empty">Kosong</td></tr>'}
  </tbody></table></div></div>
  <div class="card"><h2>Pengguna</h2><div class="form">
    <input id="un" placeholder="Username" autocapitalize="off"><input id="upw" placeholder="Password">
    <label class="chk"><input type="checkbox" id="ua"> Admin</label><button class="btn" id="uc">Tambah</button></div><div class="err" id="ue"></div>
  <div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Username</th><th>Role</th><th>Telegram</th><th></th></tr></thead><tbody>
  ${users.map(u=>`<tr><td>${esc(u.username)}</td><td>${u.admin?'Admin':'User'}</td><td class="muted">${esc(u.tg||'-')}</td><td style="text-align:right">${u.id===me.id?'':`<button class="btn bad sm" data-del-usr="${esc(u.id)}">Hapus</button>`}</td></tr>`).join('')}
  </tbody></table></div></div>`,'admin');
  $('#sc').onclick=async()=>{$('#se').textContent='';try{await post('/servers',{name:$('#sn').value.trim()||'Server',owner:$('#so').value,type:$('#st').value,ram:+$('#sr').value||1024});adminView()}catch(e){$('#se').textContent=e.message}};
  $('#uc').onclick=async()=>{$('#ue').textContent='';try{await post('/users',{username:$('#un').value.trim(),password:$('#upw').value,admin:$('#ua').checked});adminView()}catch(e){$('#ue').textContent=e.message}};
  document.querySelectorAll('[data-del-srv]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus server ini beserta file-nya?'))return;await api('/servers/'+b.dataset.delSrv,{method:'DELETE'});adminView()});
  document.querySelectorAll('[data-del-usr]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus user ini beserta semua servernya?'))return;try{await api('/users/'+b.dataset.delUsr,{method:'DELETE'});adminView()}catch(e){alert(e.message)}})}

async function serverView(id){S=await api('/servers/'+id);
  const isWeb=(S.type||'node')==='web';
  const tabs=[['console',isWeb?'Info':'Console'],['files','Files'],['env','Environment'],['startup','Pengaturan']];
  mount(`<div class="head"><div style="min-width:0;flex:1"><h1>${esc(S.name)}</h1><div class="muted" style="font-size:13px">${esc(tlabel(S))} · Kode <code>${esc(S.id)}</code></div></div>
  <div id="stBadge">${badge(S.status)}</div>
  ${isWeb?'':`<div class="power"><button class="btn ok sm" data-p="start">Start</button><button class="btn warn sm" data-p="restart">Restart</button><button class="btn ghost sm" data-p="stop">Stop</button><button class="btn bad sm" data-p="kill">Kill</button></div>`}</div>
  <div class="tabs">${tabs.map(([k,l])=>`<a data-tab="${k}" class="${tab===k?'on':''}">${l}</a>`).join('')}</div>
  <div id="tb"></div>`,'servers');
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>post(`/servers/${S.id}/power`,{action:b.dataset.p}).catch(e=>alert(e.message)));
  document.querySelectorAll('[data-tab]').forEach(a=>a.onclick=()=>{tab=a.dataset.tab;serverView(S.id)});
  pollT=setInterval(async()=>{try{const s=await api('/servers/'+S.id);const b=$('#stBadge');if(b)b.innerHTML=badge(s.status)}catch{}},3000);
  ({console:consoleTab,files:filesTab,env:envTab,startup:settingsTab})[tab]()}

function consoleTab(){
  const isWeb=(S.type||'node')==='web';
  $('#tb').innerHTML=(isWeb?`<div class="card"><p class="muted" style="margin:0">Website statis berjalan otomatis. Upload file website (index.html, css, js, gambar) di tab Files. Website tidak punya console.</p></div>`:
  `<div class="term" id="term"></div>
  <div class="cmd"><span>$</span><input id="ci" placeholder="Perintah Termux atau input bot, tanpa tombol mode" autocapitalize="off" autocomplete="off" spellcheck="false"><button class="btn ghost sm" id="stopc" style="margin-left:6px">Ctrl+C</button></div>`)+
  `<div class="info">
    <div><div class="lb"><span>CPU</span></div><div class="v" id="cpu">0%</div><div class="bar"><i id="cpub"></i></div></div>
    <div><div class="lb"><span>RAM</span></div><div class="v" id="ram">0 / ${S.ram} MB</div><div class="bar"><i id="ramb"></i></div></div>
    <div class="addr"><div class="lb"><span>Link</span><button class="btn ghost sm" id="cp" style="padding:2px 8px;font-size:12px">Salin</button></div><code id="addr">${esc(S.siteUrl)}</code></div>
  </div>`;
  const setStat=s=>{const b=$('#stBadge');if(b)b.innerHTML=badge(s)};
  const setRes=(cpu,ram,limit)=>{if(!$('#cpu'))return;
    $('#cpu').textContent=cpu.toFixed(1)+'%';$('#cpub').style.width=Math.min(100,cpu)+'%';
    $('#ram').textContent=ram+' / '+limit+' MB';$('#ramb').style.width=(limit?Math.min(100,ram/limit*100):0)+'%'};
  $('#cp').onclick=()=>{navigator.clipboard.writeText(S.siteUrl).then(()=>{$('#cp').textContent='Tersalin';setTimeout(()=>{if($('#cp'))$('#cp').textContent='Salin'},1500)}).catch(()=>{})};
  if(isWeb){setRes(0,0,S.ram);return}
  const term=$('#term');
  const add=l=>{const near=term.scrollTop+term.clientHeight>=term.scrollHeight-30;const d=document.createElement('div');d.textContent=l;term.appendChild(d);
    while(term.childElementCount>1500)term.firstChild.remove();if(near)term.scrollTop=term.scrollHeight};
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?id='+encodeURIComponent(S.id));
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='init'){m.logs.forEach(add);term.scrollTop=term.scrollHeight;setStat(m.status);if(m.stats)setRes(m.stats.cpu,m.stats.ram,m.limit)}
    else if(m.t==='log')add(m.d);
    else if(m.t==='status'){setStat(m.d);if(m.d==='offline')setRes(0,0,S.ram)}
    else if(m.t==='stats')setRes(m.cpu,m.ram,m.limit);
    else if(m.t==='clear')term.innerHTML='';};
  let cmdHist=[],hIdx=0;
  const ci=$('#ci');
  $('#stopc').onclick=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'ctrl'}))};
  const sc=$('#stopc');if(sc)sc.onclick=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'stopcmd'}))};
  ci.onkeydown=e=>{
    if(e.key==='Enter'&&ci.value.trim()){if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'cmd',d:ci.value}));cmdHist.push(ci.value);hIdx=cmdHist.length;ci.value=''}
    else if(e.key==='ArrowUp'&&hIdx>0){hIdx--;ci.value=cmdHist[hIdx]}
    else if(e.key==='ArrowDown'){hIdx=Math.min(cmdHist.length,hIdx+1);ci.value=cmdHist[hIdx]||''}}}

async function filesTab(){
  const tb=$('#tb');let list;
  try{list=await api(`/servers/${S.id}/files?path=${encodeURIComponent(cwd)}`)}catch(e){tb.innerHTML=`<div class="card err">${esc(e.message)}</div>`;return}
  const parts=cwd.split('/').filter(Boolean);let acc='';
  const crumbs=['<a data-go="/">/</a>'];
  parts.forEach(p=>{acc+='/'+p;crumbs.push(`<span class="sep">/</span><a data-go="${esc(acc)}">${esc(p)}</a>`)});
  tb.innerHTML=`<div class="toolbar"><div class="crumbs">${crumbs.join('')}</div>
   <div class="form" style="flex:0 0 auto"><button class="btn ghost sm" id="nd">Folder baru</button><button class="btn ghost sm" id="nf">File baru</button><label class="btn sm" style="cursor:pointer">Upload<input type="file" id="upl" multiple hidden></label></div></div>
   <div id="prog"></div>
   <div class="card" style="padding:0;overflow:auto"><table class="files"><tbody>
   ${cwd!=='/'?`<tr><td class="nm" data-go="${esc(parent())}">..</td><td></td><td></td></tr>`:''}
   ${list.map(x=>{const p=join(x.name);return `<tr><td class="nm" ${x.dir?`data-go="${esc(p)}"`:`data-edit="${esc(p)}"`}>${esc(x.name)}${x.dir?'/':''}</td><td class="muted" style="width:120px">${x.dir?'-':fmt(x.size)}</td><td class="act">${x.dir?'':`<a href="/api/servers/${S.id}/files/download?path=${encodeURIComponent(p)}" download>Unduh</a>`}${!x.dir&&/\.zip$/i.test(x.name)?`<button data-unzip="${esc(p)}">Ekstrak</button>`:''}<button data-del="${esc(p)}">Hapus</button></td></tr>`}).join('')||'<tr><td class="empty">Folder kosong</td></tr>'}
   </tbody></table></div>`;
  $('#nd').onclick=async()=>{const n=prompt('Nama folder');if(!n)return;await post(`/servers/${S.id}/files/mkdir`,{path:join(n)});filesTab()};
  $('#nf').onclick=async()=>{const n=prompt('Nama file');if(!n)return;await api(`/servers/${S.id}/files/write?path=${encodeURIComponent(join(n))}`,{text:''});editFile(join(n))};
  $('#upl').onchange=e=>uploadFiles([...e.target.files]);
  tb.onclick=async e=>{const t=e.target;
    if(t.dataset.go!==undefined){cwd=t.dataset.go||'/';return filesTab()}
    if(t.dataset.edit!==undefined)return editFile(t.dataset.edit);
    if(t.dataset.unzip!==undefined){
      if(!confirm('Ekstrak '+t.dataset.unzip+' ke folder ini? File dengan nama sama akan ditimpa.'))return;
      $('#prog').innerHTML='<div class="card up"><div class="row"><span><span class="spin"></span>&nbsp;Mengekstrak '+esc(t.dataset.unzip)+'...</span></div></div>';
      try{await post(`/servers/${S.id}/files/unzip`,{path:t.dataset.unzip})}catch(e){alert(e.message)}
      return filesTab()}
    if(t.dataset.del!==undefined&&confirm('Hapus '+t.dataset.del+'?')){await post(`/servers/${S.id}/files/delete`,{paths:[t.dataset.del]});filesTab()}}}

function uploadFiles(files){
  if(!files.length)return;let i=0;
  const next=()=>{
    if(i>=files.length){if($('#prog'))$('#prog').innerHTML='';return filesTab()}
    const f=files[i++];
    $('#prog').innerHTML=`<div class="card up"><div class="row"><span>${esc(f.name)} <span class="muted">(${i}/${files.length}, ${fmt(f.size)})</span></span><span id="pc">0%</span></div>
     <div class="bar"><i id="pb"></i></div><div class="row muted" id="ps">Mengunggah...</div></div>`;
    const x=new XMLHttpRequest();
    x.open('POST',`/api/servers/${S.id}/files/upload?path=${encodeURIComponent(cwd)}&name=${encodeURIComponent(f.name)}`);
    x.setRequestHeader('Content-Type','application/octet-stream');
    x.upload.onprogress=e=>{if(!e.lengthComputable)return;const p=Math.round(e.loaded/e.total*100);
      if($('#pb'))$('#pb').style.width=p+'%';if($('#pc'))$('#pc').textContent=p+'%'};
    x.upload.onload=()=>{if($('#ps'))$('#ps').innerHTML='<span class="spin"></span>&nbsp;Menyimpan di server...'};
    x.onload=()=>{if(x.status>=300){let m='Upload gagal';try{m=JSON.parse(x.responseText).error}catch{}alert(f.name+': '+m)}next()};
    x.onerror=()=>{alert('Koneksi putus saat upload: '+f.name);next()};
    x.send(f)};
  next()}

async function editFile(p){
  let txt;try{txt=await api(`/servers/${S.id}/files/read?path=${encodeURIComponent(p)}`)}catch(e){alert(e.message);return}
  $('#tb').innerHTML=`<div class="toolbar"><div class="crumbs">${esc(p)}</div>
   <div class="form" style="flex:0 0 auto"><button class="btn ghost sm" id="bk">Kembali</button><button class="btn ok sm" id="sv">Simpan</button></div></div>
   <textarea class="code" id="ed" spellcheck="false"></textarea><div class="err" id="ee"></div>`;
  $('#ed').value=txt;
  $('#bk').onclick=()=>filesTab();
  $('#sv').onclick=async()=>{try{await api(`/servers/${S.id}/files/write?path=${encodeURIComponent(p)}`,{text:$('#ed').value});
    $('#sv').textContent='Tersimpan';setTimeout(()=>{if($('#sv'))$('#sv').textContent='Simpan'},1500)}catch(e){$('#ee').textContent=e.message}}}

async function envTab(){
  let txt='';try{txt=await api(`/servers/${S.id}/files/read?path=${encodeURIComponent('/.env')}`)}catch{}
  $('#tb').innerHTML=`<div class="card"><h2>Environment (.env)</h2>
   <p class="muted" style="margin:-4px 0 12px">Satu variabel per baris dengan format KEY=VALUE. Variabel ini otomatis masuk ke proses server saat Start atau Restart. PORT sudah diisi otomatis oleh panel.</p>
   <textarea class="code" id="ev" spellcheck="false" style="min-height:320px"></textarea>
   <div class="form" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="es">Simpan .env</button></div>
   <div class="err" id="ee2"></div>
   <div class="hint">Contoh: <code>OWNER_NUMBER=628xxxx</code> <code>PREFIX=.</code></div></div>`;
  $('#ev').value=txt;
  $('#es').onclick=async()=>{try{await api(`/servers/${S.id}/files/write?path=${encodeURIComponent('/.env')}`,{text:$('#ev').value});
    $('#ee2').style.color='var(--ok)';$('#ee2').textContent='Tersimpan. Restart server agar berlaku.'}catch(e){$('#ee2').style.color='';$('#ee2').textContent=e.message}}}

function settingsTab(){
  const isWeb=(S.type||'node')==='web';
  $('#tb').innerHTML=`<div class="card"><h2>Detail</h2>
   <div class="kv"><span class="muted">Tipe</span><span>${esc(tlabel(S))}</span>
   <span class="muted">Link acak</span><span><code>${esc(S.siteUrl)}</code></span>
   <span class="muted">Link panel</span><span><code>${esc(S.address)}</code></span>
   <span class="muted">RAM</span><span>${S.ram} MB</span></div>
   <p class="hint" style="margin-top:0">${isWeb?'Website statis: upload file ke tab Files. Link langsung bisa dibuka.':'Aplikasi kamu bisa dibuka di link acak jika mendengarkan (listen) pada port dari variabel PORT.'}</p></div>
  ${isWeb?'':`<div class="card"><h2>Startup command</h2>
   <div class="field"><label>Perintah</label><input id="sc" value="${esc(S.startup)}" spellcheck="false"></div>
   <p class="hint">Default untuk ${esc(tlabel(S))}: <code>${esc(({node:'npm install && npm start',python:'pip install -r requirements.txt; python3 main.py'})[S.type||'node']||'')}</code></p></div>`}
  <div class="card"><h2>Jalankan otomatis</h2>
   <label class="chk"><input type="checkbox" id="au" ${S.autostart!==false?'checked':''}> Start otomatis saat panel dijalankan</label>
   <div class="form" style="justify-content:flex-end;margin-top:12px"><span class="muted" id="sok"></span><button class="btn" id="ss">Simpan</button></div></div>`;
  $('#ss').onclick=async()=>{try{const body={autostart:$('#au').checked};if(!isWeb)body.startup=$('#sc').value;
    await api(`/servers/${S.id}/startup`,{method:'PUT',json:body});if(!isWeb)S.startup=body.startup;S.autostart=body.autostart;$('#sok').textContent='Tersimpan'}catch(e){alert(e.message)}}}

boot();
</script>
</body>
